# YASB Reborn v2.0.7 · Catppuccin Mocha · GlazeWM 集成
# 布局与设计说明见 README.md；颜色 / 间距 token 见 widgets/tokens.css
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
show_systray: true

glazewm:
  start_command: "glazewm start"
  stop_command: "glazewm stop"
  reload_command: "glazewm reload-config"

bars:
  yasb-bar:
    # 单屏环境，这里表示所有屏幕；将来多屏可用 ["primary"] 或显示器名
    screens: ["**"]
    class_name: "yasb-bar"

    alignment:
      position: "top"
      align: "center"

    blur_effect:
      enabled: true
      dark_mode: true
      round_corners: true
      border_color: "None"

    window_flags:
      # 不占位：窗口让位交给 GlazeWM 的 outer_gap.top（42px = 栏高 36 + 6 间距）
      always_on_top: false
      windows_app_bar: false
      hide_on_fullscreen: true

    dimensions:
      width: "100%"
      height: 36

    padding:
      top: 2
      left: 6
      bottom: 0
      right: 6

    animation:
      enabled: true
      duration: 500

    widgets:
      left:
        - "bin"
        - "glazewm_binding_mode"
        - "glazewm_tiling_direction"
        - "glazewm_workspaces"
        - "active_window"
      center:
        - "cpu"
        - "gpu"
        - "memory"
        - "disk"
        - "traffic"
      right:
        - "media"
        - "brightness"
        - "volume"
        - "clock"
        - "notifications"

widgets:
  # ---------- 左侧：窗口管理 ----------
  bin:
    type: "yasb.recycle_bin.RecycleBinWidget"
    options:
      label: "<span>{icon}</span>{items_count}"
      label_alt: "Items {items_count}, Total size ({items_size})"
      icons:
        bin_empty: "\udb82\ude7a"
        bin_filled: "\udb82\ude79"
      # 左键打开、右键清空（带确认），避免误清空
      callbacks:
        on_left: "open_bin"
        on_middle: "do_nothing"
        on_right: "empty_bin"
      keybindings:
        - keys: "win+del"
          action: "empty_bin"
      show_confirmation: true

  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      hide_if_no_active: false
      label_if_no_active: ""
      default_icon: "\uf071"
      icons:
        none: ""
        resize: "\uf071"
        pause: "\uf28c"
      binding_modes_to_cycle_through:
        - "none"
        - "resize"
      callbacks:
        on_left: "next_binding_mode"
        on_middle: "toggle_label"
        on_right: "disable_binding_mode"

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM 离线"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: true
        enabled_active: true
        enabled_focused: true
        size: 16
        max_icons: 3
        hide_label: false
        hide_duplicates: true
        hide_floating: false

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[{win[process][name]}] {win[title]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 18
      max_length: 32
      max_length_ellipsis: "…"
      monitor_exclusive: true

  # ---------- 中间：系统监控（刷新频率按 CPU 开销从低到高排列） ----------
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[freq][current]} MHz"
      update_interval: 3000
      # 阈值：<50 不着色，50-75 黄，75-90 橙，>90 红
      cpu_thresholds:
        low: 50
        medium: 75
        high: 90
      # 左键切标签，中键开任务管理器，右键看图表
      callbacks:
        on_left: "toggle_label"
        on_middle: "exec cmd /c Taskmgr"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\udb81\udd03</span> {info[utilization]}%"
      label_alt: "<span>\udb81\udd03</span> {info[temp]}°C | {info[mem_used]}"
      gpu_index: 0
      update_interval: 3000
      gpu_thresholds:
        low: 50
        medium: 75
        high: 90
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_percent}%"
      label_alt: "<span>\uefc5</span> {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      memory_thresholds:
        low: 70
        medium: 85
        high: 95
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60

  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span>\uf473</span> {space[used][percent]}"
      label_alt: "<span>\uf473</span> {space[used][gb]} / {space[total][gb]}"
      volume_label: "C"
      update_interval: 60
      disk_thresholds:
        low: 70
        medium: 85
        high: 95
      group_label:
        volume_labels: ["C", "D", "E"]
        show_label_name: true
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_group"

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "\ueb01 \ueab4 {download_speed} | \ueab7 {upload_speed}"
      label_alt: "Download {download_speed} | Upload {upload_speed}"
      update_interval: 2000
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_menu"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0

  # ---------- 右侧：媒体与系统 ----------
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "open_media_source"
        on_right: "toggle_media_menu"
      max_field_size:
        label: 15
        label_alt: 25
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      # 16 会让遮罩裁切失败并刷错误日志，8 足够
      thumbnail_corner_radius: 8
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_source: true
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
      scrolling_label:
        enabled: true
        update_interval_ms: 33
        style: "left"
        separator: " | "
        label_padding: 0
        always_scroll: false
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5

  brightness:
    type: "yasb.brightness.BrightnessWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "Brightness {percent}%"
      tooltip: true
      brightness_toggle_level: [0, 50, 100]
      brightness_icons:
        - "\udb80\udcde"
        - "\udb80\udcdd"
        - "\udb80\udcdf"
        - "\udb80\udce0"
      brightness_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_brightness_menu"

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "Vol {volume}"
      # 键为音量上限（%），muted 单独一档
      icons:
        muted: "\ueee8"
        "10": "\uf026"
        "30": "\uf027"
        "60": "\uf027"
        "100": "\uf028"
      scroll_step: 2
      slider_beep: false
      tooltip: true
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\uf017</span> {%Y-%m-%d %H:%M:%S %a}"
      label_alt: "<span>\uf017</span> {%Y年%m月%d日 %H:%M:%S %A}"
      locale: "zh_CN"
      update_interval: 1000
      timezones: []
      tooltip: true
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_week_numbers: true
        show_years: true
        extended: false
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_calendar"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>\udb80\udc9e</span> {count}"
      label_alt: "{count} notifications"
      hide_empty: true
      tooltip: true
      icons:
        new: "\udb80\udc9e"
        default: "\udb80\udc9a"
      callbacks:
        on_left: "toggle_notification"
        on_middle: "do_nothing"
        on_right: "toggle_label"
