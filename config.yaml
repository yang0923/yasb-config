# GlazeWM | Catppuccin Mocha | Glazing Mocha
# Place this file at: C:/users/{username}/.config/yasb/config.yaml
# You need to Replace {username} with your username and insert your wallpaper path at line 76. also provide the info at line 305 to use the ai chat.
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
show_systray: true

# =============================================================================
# 全局样式配置说明（样式统一管理）
# =============================================================================
# 所有通用样式变量定义在 widgets/base.css 的 :root 中，修改即可全局生效：
#
# --- Catppuccin Mocha 色板 ---
#   --base / --mantle / --crust / --surface0~2 / --overlay0~2
#   --text / --subtext0~1 / --lavender / --blue / --sapphire / --sky
#   --teal / --green / --yellow / --peach / --maroon / --red
#   --mauve / --pink / --flamingo / --rosewater
#
# --- 通用布局 ---
#   --widget-padding: 0 5px    (所有 widget 统一内边距)
#   --widget-radius: 8px       (widget 圆角)
#   --icon-size: 13px          (图标字号)
#   --label-size: 13px         (标签字号)
#   --label-weight: 500        (标签字重)
#
# --- 菜单/弹窗 ---
#   --menu-bg: #181825e6       (菜单背景色)
#   --menu-border: 1px solid #b4befe14  (菜单边框)
#   --menu-radius: 10px        (菜单圆角)
#   --menu-min-width: 360px    (菜单最小宽度)
#
# --- 状态阈值颜色 ---
#   --status-low: var(--green)       (低负载)
#   --status-medium: var(--yellow)   (中负载)
#   --status-high: var(--peach)      (高负载)
#   --status-critical: var(--red)    (临界)
# =============================================================================

glazewm:
  start_command: "glazewm start"
  stop_command: "glazewm stop"
  reload_command: "glazewm reload-config"

bars:
  yasb-bar: # 任务栏名称（可自定义）
    # 屏幕选择
    # screens: ["primary"] # 显示在哪个屏幕，["primary"] 表示主屏幕
    screens: ["**"] # 显示在哪个屏幕，["primary"] 表示主屏幕

    class_name: "yasb-bar" # 窗口类名（用于样式/规则匹配）

    # 任务栏位置与对齐
    alignment:
      position: "top" # 任务栏位置：top / bottom / left / right
      align: "center" # 内容对齐方式：center / left / right（仅水平栏有效）

    # 毛玻璃模糊效果
    blur_effect:
      enabled: true # 是否启用模糊效果
      dark_mode: true # 模糊背景是否适配深色模式
      round_corners: true # 任务栏圆角
      border_color: "None" # 边框颜色，"None" 表示无边框，可填颜色值

    # 窗口标志（系统行为）
    window_flags:
      always_on_top: false # 任务栏是否总在最前（false 可被全屏程序覆盖）
      windows_app_bar: false # 使用 Windows App Bar 模式（任务栏占位）
      hide_on_fullscreen: true # 全屏应用时自动隐藏任务栏

    # 任务栏尺寸
    dimensions:
      width: "100%" # 宽度（支持像素 px 或百分比 %）
      height: 36 # 高度（像素）

    # 内边距（任务栏内部内容与边缘的距离）
    padding:
      top: 2 # 上内边距
      left: 6 # 左内边距
      bottom: 0 # 下内边距
      right: 6 # 右内边距

    # 动画效果
    animation:
      enabled: true # 是否启用动画（显示/隐藏）
      duration: 500 # 动画时长（毫秒）

    # 小部件布局
    widgets:
      left: # 左侧区域显示的小组件
        - "bin" # 回收站
        # - "wallpapers"
        # - "power_menu" # 电源菜单（关机/重启/锁定）
        # - "notes" # 便签
        # - "todo" # 待办事项
        - "glazewm_binding_mode" # GlazeWM 当前模式
        - "glazewm_tiling_direction" # GlazeWM 平铺方向指示器
        - "glazewm_workspaces" # GlazeWM 工作区切换器
        - "active_window" # 当前活动窗口标题

      center: # 中间区域
        # - "pomodoro" # 番茄时钟: 计时工具
        # - "glazewm_binding_mode" # GlazeWM 当前模式
        # - "glazewm_tiling_direction" # GlazeWM 平铺方向指示器
        # - "glazewm_workspaces" # GlazeWM 工作区切换器
        # - "active_window" # 当前活动窗口标题
        - "cpu" # CPU 使用率
        - "gpu" # GPU 使用率
        - "memory" # 内存使用率
        - "disk" # 磁盘使用率
        - "traffic" # 网络流量监控

      right: # 右侧区域
        - "media" # 媒体信息显示
        # - "systray" # 系统托盘图标
        # - "github" # github
        - "brightness" # 亮度滑块/指示器
        - "volume" # 音量控制
        - "clock" # 日期时钟
        - "notifications" # 通知中心

widgets:
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}{s}{artist}"
      label_alt: "{title}"
      separator: " - "
      hide_empty: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "open_media_source"
        on_right: "toggle_media_menu"
      max_field_size:
        label: 15
        label_alt: 25
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: false
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_source: true
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
      scrolling_label:
        enabled: true
        update_interval_ms: 33
        style: "left" # can be "left", "right", "bounce", "bounce-ease"
        separator: " | "
        label_padding: 0
        always_scroll: false
        # Easing curve params: https://www.desmos.com/calculator/j7eamemxzi
        ease_slope: 20
        ease_pos: 0.8
        ease_min: 0.5

  bin:
    type: "yasb.recycle_bin.RecycleBinWidget"
    options:
      label: "<span>{icon}</span>{items_count}"
      label_alt: "Items {items_count}, Total size ({items_size})"
      icons:
        bin_empty: "\udb82\ude7a"
        bin_filled: "\udb82\ude79"
      callbacks:
        on_left: "empty_bin"
        on_right: "open_bin"
        on_middle: "do_nothing"
      keybindings:
        - keys: "win+del"
          action: "empty_bin"
      show_confirmation: true

  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM 离线"
      hide_if_offline: false
      monitor_exclusive: true
      enable_scroll_switching: true
      reverse_scroll_direction: false
      app_icons:
        enabled_populated: true # 开启：有窗口的工作区显示图标
        enabled_active: true # 开启：活动工作区显示图标
        enabled_focused: true # 显式设置聚焦状态
        size: 16
        max_icons: 3 # 最多显示 3 个图标，避免溢出
        hide_label: false
        hide_duplicates: true
        hide_floating: false

  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      hide_if_no_active: false
      label_if_no_active: ""
      default_icon: "\uf071"
      icons:
        none: ""
        resize: "\uf071" # 调整大小模式
        pause: "\uf28c" # 暂停模式
      binding_modes_to_cycle_through:
        - "none"
        - "resize"
      callbacks:
        on_left: "next_binding_mode"
        on_middle: "toggle_label"
        on_right: "disable_binding_mode"

  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[{win[process][name]}] {win[title]}" # Alt 标签显示进程名
      label_no_window: ""
      label_icon: true
      label_icon_size: 18 # 略微放大图标
      max_length: 32 # 从 20 放宽到 32
      max_length_ellipsis: "…"
      monitor_exclusive: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\uf017</span> {%Y-%m-%d %H:%M:%S %a}"
      label_alt: "<span>\uf017</span> {%Y年%m月%d日 %H:%M:%S %A}"
      locale: "zh_CN"
      update_interval: 1000
      timezones: []
      tooltip: true
      calendar:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_week_numbers: true
        show_years: true
        extended: false
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "toggle_calendar"

